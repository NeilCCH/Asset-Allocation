name: Supabase Keep-Alive

# 免費版 Supabase 專案長時間無活動會被自動暫停。
# 此工作流程定期對 REST API 做一次真實資料表查詢(觸發 Postgres 活動),重置閒置計時。
# 排程:每個「工作日(週一至週五)」台灣早上各一次,盡量頻繁產生活動。
# ⚠️ 注意:實測仍曾被暫停,ping 並不保證擋得住免費版暫停;正式服務建議升級 Supabase Pro(永不自動暫停)。

on:
  schedule:
    - cron: "25 0 * * 1-5" # 週一至週五 00:25 UTC(台灣 08:25 早上);避開整點以減少 GitHub 排程壅塞延遲
  workflow_dispatch: {} # 也可在 Actions 頁面手動觸發測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (一次 DB 查詢)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::缺少 SUPABASE_URL 或 SUPABASE_ANON_KEY,請到 repo Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi
          # 查 advisors 資料表一筆(limit=1)。RLS 若擋下回傳空陣列仍屬有效查詢,HTTP 皆為 2xx。
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/advisors?select=id&limit=1")
          echo "Supabase 回應 HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Keep-alive 失敗(HTTP ${code}) — 專案可能已暫停或金鑰失效,請至 Supabase 後台檢查。"
            exit 1
          fi
          echo "✅ Keep-alive 成功,閒置計時已重置。"
